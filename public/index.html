<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ranking de Performance · Lion Negócios Imobiliários</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="glow"></div>

  <header class="topbar">
    <div class="brand">
      <img class="brand-logo brand-dark" src="/logo-lion-branco.png" alt="Lion Negócios Imobiliários" />
      <img class="brand-logo brand-light" src="/logo-lion-preto.png" alt="Lion Negócios Imobiliários" />
      <span class="ao-vivo"><i></i>AO VIVO</span>
    </div>
    <div class="controls">
      <div class="chips" id="chips">
        <button class="chip" data-preset="semana">Semana</button>
        <button class="chip ativo" data-preset="mes">Mês</button>
        <button class="chip" data-preset="custom">Período</button>
      </div>
      <div class="datas oculto" id="datasCustom">
        <input type="date" id="inicio" /><span>→</span><input type="date" id="fim" />
        <button class="btn" id="aplicar">OK</button>
      </div>
      <button class="theme-toggle" id="themeToggle" title="Alternar tema" aria-label="Alternar tema">
        <span class="ico-sol">☀︎</span><span class="ico-lua">☾</span>
      </button>
    </div>
  </header>

  <nav class="views" id="views">
    <button class="view-tab ativo" data-view="ranking">Ranking</button>
    <button class="view-tab" data-view="perfil">Perfil comportamental</button>
    <button class="view-tab" data-view="metodo">Como o score é calculado</button>
  </nav>

  <main id="conteudo">
    <div class="carregando" id="carregando">
      <div class="loader"></div>
      <p>Consultando o Supremo CRM…</p>
    </div>
  </main>

  <footer class="rodape"><span id="rodapeInfo"></span></footer>

  <script src="/app.js"></script>
</body>
</html>
